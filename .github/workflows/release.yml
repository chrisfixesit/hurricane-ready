name: Release

on:
  push:
    branches: [main]
    # Docs-only changes don't affect the image, so skip the build + ECS
    # redeploy. workflow_dispatch still forces a release when needed.
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # GHCR
  id-token: write   # AWS OIDC (used only when AWS vars are set)

# One release at a time per ref. Each run pushes :latest and redeploys, so
# overlapping runs could finish out of order and leave an older build live
# (seen 2026-11-08 when #94-#96 merged together). Queued runs wait rather
# than cancel, so a half-finished deploy is never interrupted. GitHub doesn't
# guarantee queue order, so the `current` job below also makes a run that
# isn't main's newest commit skip publishing. Keyed by ref so a manual run on
# another branch can't displace a pending main release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  # Runs once this run holds the lock: publish only if our commit is still
  # main's head, so a stale run can never push :latest after a newer one.
  current:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      newest: ${{ steps.check.outputs.newest }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "newest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main has moved on to ${head::12}; skipping so this older build can't be published last."
            echo "newest=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: current
    if: needs.current.outputs.newest == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Build image
        run: |
          docker build \
            -t hurricane-ready:${GITHUB_SHA::12} \
            -t hurricane-ready:latest .

      # ---------- GHCR (always; no cloud account needed) ----------

      - name: Push to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          GHCR="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag hurricane-ready:latest "$GHCR:latest"
          docker tag hurricane-ready:latest "$GHCR:${GITHUB_SHA::12}"
          docker push "$GHCR:latest"
          docker push "$GHCR:${GITHUB_SHA::12}"

      # ---------- AWS (activates when AWS_DEPLOY_ROLE_ARN repo variable is set) ----------

      - name: Assume AWS role via OIDC
        if: vars.AWS_DEPLOY_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Push to ECR
        if: vars.AWS_DEPLOY_ROLE_ARN != ''
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "${{ vars.ECR_REPOSITORY }}"
          docker tag hurricane-ready:latest "${{ vars.ECR_REPOSITORY }}:latest"
          docker tag hurricane-ready:latest "${{ vars.ECR_REPOSITORY }}:${GITHUB_SHA::12}"
          docker push "${{ vars.ECR_REPOSITORY }}:latest"
          docker push "${{ vars.ECR_REPOSITORY }}:${GITHUB_SHA::12}"

      - name: Redeploy ECS service
        if: vars.AWS_DEPLOY_ROLE_ARN != '' && vars.ECS_CLUSTER != '' && vars.ECS_SERVICE != ''
        # --task-definition takes the family name, so each release also picks up
        # the latest revision tofu registered (the service ignores
        # task_definition drift, so nothing else would switch it).
        run: |
          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --service "${{ vars.ECS_SERVICE }}" \
            --task-definition hurricane-ready \
            --force-new-deployment \
            --region "$AWS_REGION"
          aws ecs wait services-stable \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --services "${{ vars.ECS_SERVICE }}" \
            --region "$AWS_REGION"
