name: Release

on:
  push:
    branches: [main]
    # Docs-only changes don't affect the image, so skip the build + ECS
    # redeploy. workflow_dispatch still forces a release when needed.
    paths-ignore:
      - '**.md'
  workflow_dispatch:

# Read-only by default; only `publish` gets package-write and OIDC.
permissions:
  contents: read

# One release at a time per ref. Each run registers a revision and redeploys, so
# overlapping runs could finish out of order and leave an older build live
# (seen 2026-11-08 when #94-#96 merged together). Queued runs wait rather
# than cancel, so a half-finished deploy is never interrupted. GitHub doesn't
# guarantee queue order and may drop a pending run, so whichever run takes the
# lock builds main's *current* head (see `current` below), not the commit that
# triggered it: the newest code always ends up live. Keyed by ref so a manual
# run on another branch can't displace a pending main release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  # Runs once this run holds the lock and resolves main's head at that moment.
  # Publishing that commit (rather than GITHUB_SHA) means a stale or reordered
  # run still ships the newest code, and a docs-only commit on top (which
  # doesn't trigger a release itself) still carries the code beneath it.
  current:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::main has moved on to ${head::12}; releasing that instead of ${GITHUB_SHA::12}."
          fi
          echo "sha=$head" >> "$GITHUB_OUTPUT"

  publish:
    needs: current
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # GHCR
      id-token: write   # AWS OIDC (used only when AWS vars are set)
    env:
      SHA: ${{ needs.current.outputs.sha }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ needs.current.outputs.sha }}

      - name: Build image
        run: |
          docker build \
            -t hurricane-ready:${SHA::12} \
            -t hurricane-ready:latest .

      # ---------- GHCR (always; no cloud account needed) ----------

      - name: Push to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          GHCR="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag hurricane-ready:latest "$GHCR:latest"
          docker tag hurricane-ready:latest "$GHCR:${SHA::12}"
          docker push "$GHCR:latest"
          docker push "$GHCR:${SHA::12}"

      # ---------- AWS (activates when AWS_DEPLOY_ROLE_ARN repo variable is set) ----------

      - name: Assume AWS role via OIDC
        if: vars.AWS_DEPLOY_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ECR gets only the commit-SHA tag (#34). Deploys reference that exact
      # image, so the repo can be IMMUTABLE and a rollback really goes back to
      # the previous build. If this commit's image is already there (a re-run),
      # reuse it: an IMMUTABLE repo refuses to overwrite a tag.
      - name: Push to ECR
        if: vars.AWS_DEPLOY_ROLE_ARN != ''
        run: |
          IMAGE="${{ vars.ECR_REPOSITORY }}:${SHA::12}"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "${{ vars.ECR_REPOSITORY }}"
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "::notice::$IMAGE is already in ECR; deploying the existing image."
          else
            docker tag hurricane-ready:latest "$IMAGE"
            docker push "$IMAGE"
          fi

      # Deploy exactly this build (#34). Copy the newest task definition
      # revision (tofu-or-not-tofu owns its settings), swap in the SHA image,
      # register it and point the service at it. If ECS's circuit breaker rolls
      # the deploy back, `services-stable` still succeeds on the old revision,
      # so check which revision ended up live and fail the run if it isn't ours.
      - name: Deploy to ECS
        if: vars.AWS_DEPLOY_ROLE_ARN != '' && vars.ECS_CLUSTER != '' && vars.ECS_SERVICE != ''
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          SERVICE: ${{ vars.ECS_SERVICE }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          IMAGE="$ECR_REPOSITORY:${SHA::12}"
          aws ecs describe-task-definition --task-definition hurricane-ready \
            --region "$AWS_REGION" --query taskDefinition > current-td.json
          jq --arg img "$IMAGE" '
            .containerDefinitions |= map(if .name == "app" then .image = $img else . end)
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
          ' current-td.json > new-td.json
          NEW_TD=$(aws ecs register-task-definition --region "$AWS_REGION" \
            --cli-input-json file://new-td.json \
            --query taskDefinition.taskDefinitionArn --output text)
          echo "Registered $NEW_TD with $IMAGE"

          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" \
            --task-definition "$NEW_TD" --region "$AWS_REGION" > /dev/null
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE" \
            --region "$AWS_REGION"

          read -r LIVE_TD ROLLOUT < <(aws ecs describe-services \
            --cluster "$CLUSTER" --services "$SERVICE" --region "$AWS_REGION" \
            --query 'services[0].deployments[?status==`PRIMARY`] | [0].[taskDefinition, rolloutState]' \
            --output text)
          if [ "$LIVE_TD" != "$NEW_TD" ] || [ "$ROLLOUT" != "COMPLETED" ]; then
            echo "::error::Deploy of $IMAGE didn't stick: the service is on $LIVE_TD ($ROLLOUT). ECS rolled back to the last good deployment; check the stopped tasks' reasons in the ECS console."
            exit 1
          fi
          echo "::notice::Live: $NEW_TD running $IMAGE"
